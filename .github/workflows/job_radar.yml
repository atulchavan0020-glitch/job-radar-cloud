name: 24/7 Cloud Job Radar

on:
  schedule:
    # Runs every 2 hours UTC (or customize to hourly '0 * * * *')
    - cron: '0 */2 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI anytime

permissions:
  contents: write

jobs:
  check-jobs:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Job Radar Scanner
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          ALERT_EMAIL: ${{ secrets.ALERT_EMAIL || 'Atulchavan0020@gmail.com' }}
        run: |
          python main.py

      - name: Commit Updated Job History
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add jobs_history.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore(radar): update job history [skip ci]" && git push)
